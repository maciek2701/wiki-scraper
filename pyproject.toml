[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wikiscraper"
version = "0.1.0"
requires-python = ">=3.11"
description = "WikiScraper project for Python course"
authors = [{ name = "Maciej Padarz" }]
dependencies = [
  "beautifulsoup4>=4.12",
  "numpy>=1.26",
  "pandas>=2.1",
  "requests>=2.32",
  "tomlkit>=0.13",
]

[project.optional-dependencies]
analysis = ["matplotlib", "wordfreq"]
notebook = ["jupyter", "ipykernel"]
dev = ["black", "ruff", "pytest"]

[tool.setuptools]
packages = { find = {} }


[tool.black]
line-length = 88
target-version = ["py311"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

# importy
[tool.ruff.lint.isort]
known-first-party = ["wikiscraper"]
combine-as-imports = true

